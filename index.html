<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Reveal The Memories</title>

<link rel="stylesheet" href="spell.css">

</head>

<body>

<div class="overlay">

    <div class="parchment">

        <p class="intro">

            Speak the secret spell
            to reveal the hidden memories.

        </p>

        <button id="micBtn">

            🎤 Speak The Spell

        </button>

        <p id="spellStatus">

            Tap the microphone

        </p>

        <div class="divider">

            — or —

        </div>

        <input
            type="password"
            id="password"
            placeholder="Enter Password"
        >

        <button id="unlockBtn">

            Reveal Memories

        </button>

        <p id="error"></p>

    </div>

</div>

<script src="spell.js"></script>

</body>

</html>
