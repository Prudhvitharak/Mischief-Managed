<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mischief Managed</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- COVER -->

    <div id="cover" class="page">

        <h1 class="title">
            MISCHIEF MANAGED
        </h1>

        <p class="subtitle">
            A Hidden Manuscript of Memories
        </p>

        <div class="seal" onclick="showPassword()">
            OPEN
        </div>

    </div>

    <!-- PASSWORD -->

    <div id="passwordPage" class="page hidden">

        <h2>Enter Password</h2>

        <input
            type="password"
            id="passwordInput"
            placeholder="Password">

        <br>

        <button onclick="checkPassword()">
            Reveal Manuscript
        </button>

    </div>

    <!-- QUESTION -->

    <div id="questionPage" class="page hidden">

        <h2>Question I</h2>

        <p>Where did we first meet?</p>

        <input
            type="text"
            id="answerInput"
            placeholder="Your Answer">

        <br>

        <button onclick="checkAnswer()">
            Unlock Memory
        </button>

    </div>

    <!-- CHAPTER -->

    <div id="chapterPage" class="page hidden">

        <h1>CHAPTER I</h1>

        <h2>The Beginning</h2>

        <img
            src="https://picsum.photos/600/300"
            class="photo">

        <p>
            This is where your memory will go.
            Later you can replace this text with
            your actual story and photos.
        </p>

    </div>

    <script src="script.js"></script>

</body>

</html>
