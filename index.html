<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
/>

<title>Mischief Managed</title>

<link rel="stylesheet" href="style.css">

<!-- THREE JS IMPORT MAP -->

<script type="importmap">
{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.165/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165/examples/jsm/"
    }
}
</script>

</head>
<div id="passwordModal" class="modal">

    <div class="modal-card">

        <h2>Reveal the Hidden Memories</h2>

        <input
            type="password"
            id="passwordInput"
            placeholder="Enter Password"
        >

        <div class="hint-section">

            <button id="hintBtn">?</button>

            <span>Hint</span>

        </div>

        <p id="hintText">
            What is the probability that we meet during ITP?
            <br>
            (Don't worry... ask me on WhatsApp)
        </p>

        <button id="unlockBtn">
            Unlock
        </button>

    </div>

</div>
    

<body>

<div class="cover">

    <!-- Background -->

    <img
        src="assets/Background.png"
        class="background"
        alt=""
    >

    <!-- 3D Model -->

    <div id="model-container"></div>

    <!-- Invisible Wax Seal Button -->

    <button id="openButton"></button>

</div>

<script type="module" src="script.js"></script>

</body>
</html>
