<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mischief Managed</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="corner top-left"></div>
    <div class="corner top-right"></div>
    <div class="corner bottom-left"></div>
    <div class="corner bottom-right"></div>

    <div class="cover">

        <h1 class="title">MISCHIEF MANAGED</h1>

        <p class="subtitle">
            A Hidden Manuscript of Memories
        </p>

        <div class="seal" onclick="openBook()">
            OPEN
        </div>

    </div>

    <script>
        function openBook() {

            const password = prompt(
                "This manuscript is protected.\n\nEnter the password:"
            );

            if (password === "hogwarts") {

                alert("Welcome, Keeper of Memories.");

            } else {

                alert("The manuscript remains sealed.");

            }
        }
    </script>

</body>
