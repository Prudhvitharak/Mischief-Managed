<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Mischief Managed</title>

<link rel="stylesheet" href="spell.css">

</head>

<body>

<div class="overlay">

    <div class="parchment">

        <p class="intro">

            To reveal the hidden memories,
            speak the spell or enter the password.

        </p>

        <!-- MIC BUTTON -->

        <button id="micBtn">

            🎤 Speak The Spell

        </button>

        <p id="spellStatus">

            Tap the microphone and say  the spell

        </p>

        <!-- DIVIDER -->

        <div class="divider">

            — OR —

        </div>

        <!-- PASSWORD -->

        <input
            type="password"
            id="password"
            placeholder="Enter Password"
        >

        <button id="unlockBtn">

            Reveal Memories

        </button>

        <p id="error"></p>

    </div>

</div>

<script src="spell.js"></script>

</body>

</html>
