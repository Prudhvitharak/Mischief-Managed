
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Mischief Managed</title>

    <link rel="stylesheet" href="spell.css">
</head>

<body>

    <!-- PASSWORD AND SPELL PAGE -->
    <div class="overlay">

        <div class="parchment">

            <p class="intro">
                To reveal the hidden memories,
                speak the spell or enter the password.
            </p>

            <!-- MICROPHONE BUTTON -->
            <button id="micBtn" type="button">
                🎤 Speak The Spell
            </button>

            <p id="spellStatus">
                Tap the microphone and say the spell
            </p>

            <!-- DIVIDER -->
            <div class="divider">
                — OR —
            </div>

            <!-- PASSWORD -->
            <input
                type="password"
                id="password"
                placeholder="Enter Password"
                autocomplete="off"
            >

            <button id="unlockBtn" type="button">
                Reveal Memories
            </button>

            <p id="error"></p>

        </div>

    </div>

    <!-- MAGICAL LOADING SCREEN -->
    <div id="loadingScreen" class="loading-screen">

        <div class="loading-content">

            <div class="magic-symbol">✦</div>

            <h1>Mischief Managed</h1>

            <p id="loadingMessage">
                Unfolding your memories...
            </p>

            <div class="loading-line">
                <span></span>
            </div>

        </div>

    </div>

    <!-- YOUR EXISTING JAVASCRIPT -->
    <script src="spell.js"></script>

</body>
</html>
