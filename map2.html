
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mischief Managed — Map II</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            min-height: 100%;
            background: #21150e;
            font-family: Georgia, "Times New Roman", serif;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;
            overflow-x: hidden;
        }

        /* POSTER */
        .map-container {
            position: relative;
            width: 100%;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .map-poster {
            display: block;
            width: 100%;
            height: auto;
            min-height: 100vh;
            min-height: 100dvh;
            object-fit: cover;
            object-position: top center;
        }

        /* CENTERED FLOATING BUTTON */
        .coming-soon {
            position: fixed;
            z-index: 10;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);

            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;

            width: max-content;
            max-width: 90%;
            padding: 16px 22px;

            color: #fff0d0;
            text-decoration: none;
            text-align: left;

            background: rgba(43, 25, 14, 0.72);
            border: 1px solid rgba(230, 193, 130, 0.8);
            border-radius: 14px;

            -webkit-backdrop-filter: blur(6px);
            backdrop-filter: blur(6px);

            box-shadow: 0 5px 22px rgba(0, 0, 0, 0.4);

            animation: float 3s ease-in-out infinite;
            -webkit-tap-highlight-color: transparent;
        }

        .broom {
            font-size: 30px;
            line-height: 1;
        }

        .button-text strong {
            display: block;
            font-size: 15px;
            font-weight: normal;
            line-height: 1.4;
        }

        .button-text small {
            display: block;
            margin-top: 5px;
            font-size: 12px;
            font-style: italic;
            opacity: 0.85;
        }

        .coming-soon:active {
            background: rgba(75, 43, 22, 0.92);
        }

        @keyframes float {
            0%, 100% {
                translate: 0 0;
            }

            50% {
                translate: 0 -5px;
            }
        }

        @media (max-width: 480px) {
            .coming-soon {
                padding: 14px 17px;
                gap: 10px;
                max-width: 92%;
            }

            .broom {
                font-size: 26px;
            }

            .button-text strong {
                font-size: 14px;
            }

            .button-text small {
                font-size: 11px;
            }
        }
    </style>
</head>

<body>

    <main class="map-container">
        <img
            src="assets/Map2.png"
            class="map-poster"
            alt="The next chapter of our memory map"
        >
    </main>

    <!-- Tap this floating button to return to Map I -->
    <a href="map1.html" class="coming-soon">
        <span class="broom">🧹</span>

        <span class="button-text">
            <strong>Return to Map I</strong>
            <small>More memories await ✨</small>
        </span>
    </a>

</body>
</html>
